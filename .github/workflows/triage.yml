name: MiMo Hunt - Triager (Validate Leads)

on:
  schedule:
    - cron: "23,53 * * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  MODEL_ID: opencode-go/ox-alpha-free

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: qwen-triage
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install OpenCode
        run: |
          export PATH="$HOME/.opencode/bin:$HOME/.local/bin:$HOME/.npm-global/bin:$PATH"
          if command -v opencode >/dev/null 2>&1; then
            opencode --version
            exit 0
          fi
          npm install -g opencode-ai 2>/dev/null || npm install -g --prefix "$HOME/.npm-global" opencode-ai 2>/dev/null || true
          if ! command -v opencode >/dev/null 2>&1; then
            for i in 1 2 3; do
              curl -fsSL https://opencode.ai/install | bash && break
              echo "opencode.ai installer attempt $i failed, retrying in 15s..."
              sleep 15
            done
          fi
          export PATH="$HOME/.opencode/bin:$HOME/.local/bin:$HOME/.npm-global/bin:$PATH"
          opencode --version

      - name: Collect UNVALIDATED leads
        id: collect
        run: |
          mkdir -p triage reports
          grep -h "\[UNVALIDATED\]" leads/lead-*.md leads/reposcan-*.md 2>/dev/null | sort -u | head -25 > new-leads.txt
          if [ ! -s new-leads.txt ]; then
            grep -hE '^\[HYP\]|^\[LEAD\]' leads/lead-*.md leads/reposcan-*.md 2>/dev/null | sort -u | head -25 > new-leads.txt
          fi
          wc -l new-leads.txt
          # hard gate: NO leads -> mark outputs, skip all downstream model steps
          if [ ! -s new-leads.txt ] || ! grep -qE '[A-Za-z0-9]' new-leads.txt; then
            echo "NO_LEADS" > triage-output.txt
            echo "triage skipped: no leads to validate"
            echo "has_leads=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_leads=true" >> "$GITHUB_OUTPUT"

      - name: Passive live probe of endpoint leads
        if: steps.collect.outputs.has_leads == 'true'
        run: |
          : > probe-results.txt
          python3 -c "import yaml; print(yaml.safe_load(open('scope.yml'))['probe_allow'].lower())" > probe-allow.txt
          cat probe-allow.txt
          grep -oE 'https?://[a-zA-Z0-9._/-]+' new-leads.txt | sort -u | head -20 | while read -r url; do
            host=$(echo "$url" | sed -E 's|https?://([^/]+).*|\1|')
            if echo "$host" | grep -qiE "$(cat probe-allow.txt)"; then
                code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 -A 'Mozilla/5.0 (passive research probe)' -H 'Range: bytes=0-1' "$url" 2>/dev/null || echo TIMEOUT)
                echo "$code $url" >> probe-results.txt
                sleep 1
            fi
          done
          cat probe-results.txt

      - name: Evidence gate (only leads with non-trivial probe evidence pass)
        id: gate
        if: steps.collect.outputs.has_leads == 'true'
        run: |
          python3 << 'PY'
          import re, os
          # non-trivial = 200/201/301/302/401/403/405/500 with a real response,
          # or a 4xx/5xx on a path that is NOT a standard 404. TIMEOUT/000 never passes.
          evidence = {}
          if os.path.exists('probe-results.txt'):
              for line in open('probe-results.txt', errors='ignore'):
                  parts = line.strip().split(None, 1)
                  if len(parts) == 2:
                      code, url = parts
                      if code in ('200','201','204','301','302','307','308','401','403','405','500','502','503') and code != '000':
                          evidence[url.rstrip('/')] = code
          kept, dropped = [], 0
          if os.path.exists('new-leads.txt'):
              for line in open('new-leads.txt', errors='ignore'):
                  urls = re.findall(r'https?://[^\s"\)\]\}]+', line)
                  if urls and any(u.rstrip('/') in evidence or u in evidence for u in urls):
                      kept.append(line.strip())
                  else:
                      dropped += 1
          with open('new-leads.txt', 'w') as f:
              f.write('\n'.join(kept) + '\n')
          with open('evidence.txt', 'w') as f:
              for u, c in evidence.items():
                  f.write(f"{c} {u}\n")
          print(f"EVIDENCE GATE: kept {len(kept)} lead(s) with probe evidence, dropped {dropped} unproven")
          with open(os.environ.get('GITHUB_OUTPUT', 'gate.out'), 'a') as out:
              out.write('has_evidence=true\n' if kept else 'has_evidence=false\n')
          # if nothing survived the gate, skip the model (marker prevents downstream false VALIDs)
          if not kept:
              open('triage-output.txt', 'w').write('NO_EVIDENCE: no lead passed the probe-evidence gate. Nothing validated.\n')
              print('no evidence-backed leads — triage model skipped')
          PY

      - name: Validate with second model (7-Question Gate)
        if: steps.collect.outputs.has_leads == 'true' && steps.gate.outputs.has_evidence == 'true'
        run: |
          cat > triage-prompt.txt << 'PROMPT_START'
          You are a strict triager. A hunt bot produced the leads below for FIVE
          MAX MODE (ox-alpha-free 1M ctx): dig DEEPER + FASTER. Directives:
          - Hunt HIGH-VALUE classes first: broken auth/session handling, IDOR/BOLA, SSRF-to-cloud-metadata (169.254.169.254), mass assignment, JWT alg/key confusion, OAuth redirect_uri/state flaws, business logic on money/auth flows, file upload, GraphQL introspection+mutations.
          - CHAIN primitives aggressively: open redirect -> OAuth code theft -> ATO; XSS -> session theft -> ATO; IDOR -> cross-tenant PII dump; SSRF -> metadata -> keys. One chained lead beats ten weak ones.
          - Request-level reasoning only: exact METHOD path + params + headers + body, expected vs actual status codes. No prose filler, no restating context.
          - Breadth pass over the FULL inventory for anomalies (odd status codes, interesting param names like id/uid/email/user_id, versioned APIs /api/v1|v2|beta|internal, debug/test flags, swagger/openapi/json exposure), then depth on top-3 anomalies this cycle.
          - If a hypothesis needs live confirmation you cannot do passively, emit [NEXT] PROBE with the EXACT read-only request so the next cycle executes it immediately.
          email-only disclosure programs: duocircle, emsisoft, docker, posit,
          coxautomotive. Your job: validate each against the 7-Question Gate.
          Answer all 7 for each lead:
          Q1 Is it in the program scope (scope.yml — target domains)?
          Q2 Can an attacker reach it (public, unauthenticated or low-priv)?
          Q3 Is there real security impact (not just weirdness)?
          Q4 Can you prove it without invasive testing (GET/HEAD only)?
          Q5 Is it genuinely novel/unreported (no duplicates)?
          Q6 Is it not on the always-rejected list (info disclosure of public data,
              best practice, rate limit absence alone, self-XSS, etc.)?
          Q7 Would a reasonable triager accept it as a real vulnerability?

          Verdict per lead: VALID / INVALID / HOLD (with one-line reason).
          For VALID: state the minimal read-only proof steps, impact, CVSS 3.1,
          and the correct reporting channel (the target's disclosure email from scope.yml).

          PROBE RESULTS (passive GET/HEAD, http_code per url):
          PROMPT_START
          cat probe-results.txt >> triage-prompt.txt
          echo "" >> triage-prompt.txt
          echo "SCOPE:" >> triage-prompt.txt
          cat scope.yml >> triage-prompt.txt
          echo "" >> triage-prompt.txt
          echo "PROBE EVIDENCE (live responses for lead URLs — cite these in every verdict):" >> triage-prompt.txt
          cat evidence.txt >> triage-prompt.txt 2>/dev/null || true
          echo "" >> triage-prompt.txt
          echo "HARD RULES:" >> triage-prompt.txt
          echo "- VALID is allowed ONLY when a lead's URL has probe evidence above AND the response itself demonstrates a security issue (e.g. config/secrets in body, auth bypass on a protected resource, open bucket listing)." >> triage-prompt.txt
          echo "- An in-scope domain alone, a reachable endpoint alone, or a generic hypothesis (SSRF/misconfig/wildcard) with no demonstrated issue = HOLD or INVALID, never VALID." >> triage-prompt.txt
          echo "- Unproven generic hypotheses must be HOLD. If nothing has evidence, output NO_VALID." >> triage-prompt.txt
          echo "" >> triage-prompt.txt
          echo "LEADS:" >> triage-prompt.txt
          cat new-leads.txt >> triage-prompt.txt
          export PATH="$HOME/.opencode/bin:$HOME/.local/bin:$HOME/.npm-global/bin:$PATH"
          timeout -k 15 25m opencode run --model "$MODEL_ID" < triage-prompt.txt > triage-output.txt 2>&1 || true
          echo "=== triage preview ==="; head -40 triage-output.txt

      - name: Update valid-bugs counter
        if: steps.collect.outputs.has_leads == 'true' && steps.gate.outputs.has_evidence == 'true'
        run: |
          mkdir -p triage reports
          {
            echo ""
            echo "===== TRIAGE $(date -u +'%Y-%m-%d %H:%M:%S UTC') ====="
            cat triage-output.txt
          } >> triage/run-$(date -u +'%Y-%m-%d-%H-%M').md
          python3 << 'PY'
          import re
          try:
              txt = open('triage-output.txt', errors='ignore').read()
          except Exception:
              txt = ''
          # only count verdicts that cite a URL from the evidence gate — rubber-stamps die here
          ev = []
          try:
              ev = [u for line in open('evidence.txt', errors='ignore') for u in re.findall(r'https?://[^\s]+', line)]
          except Exception:
              pass
          verdict_lines = [l.strip() for l in txt.split('\n')
                           if re.search(r'(?<!IN)\bVALID\b', l, re.I)
                           and not re.search(r'\bINVALID\b', l, re.I)
                           and re.search(r'verdict|^\||^\s*\*\*VALID|^\s*VALID', l, re.I)]
          # strict: verdict must cite an EXACT evidence URL — else discard
          # (hostname-only matching is forbidden: a hallucinated duocircle.com
          #  verdict must not pass because some OTHER url on duocircle.com was probed)
          ev_host = {u for u in ev}
          strict = [v for v in verdict_lines if any(u in v for u in ev_host)]
          verdict_lines = strict  # fall-through is the bug: empty evidence => zero VALIDs
          if verdict_lines:
              with open('reports/valid-bugs.md', 'a') as f:
                  stamp = __import__('datetime').datetime.now(__import__('datetime').timezone.utc).strftime('%Y-%m-%d %H:%M:%S UTC')
                  f.write(f"\n- {len(verdict_lines)} lead(s) marked VALID at {stamp}\n")
                  for vl in verdict_lines[:20]:
                      f.write(f"  - {vl[:200]}\n")
              total = open('reports/valid-bugs.md').read().count('lead(s) marked VALID')
              print(f"RUNNING VALID COUNT: {total}")
          else:
              print('no VALID verdicts this cycle')
          PY

      - name: Append learnings to knowledge base
        if: steps.collect.outputs.has_leads == 'true' && steps.gate.outputs.has_evidence == 'true'
        run: |
          python3 << 'PY'
          import re, os, datetime
          stamp = datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%d %H:%M:%S UTC')
          kpath = 'knowledge/index.md'
          os.makedirs('knowledge', exist_ok=True)
          if not os.path.exists(kpath):
              open(kpath, 'w').write('# Knowledge Base (seed)\n')
          ktext = open(kpath).read()
          learnings = []
          try:
              txt = open('triage-output.txt', errors='ignore').read()
          except Exception:
              txt = ''
          # only accept INVALID/HOLD lines that CITE an evidence URL — hallucinated
          # rejection reasons must not pollute the knowledge base either
          ev_urls = []
          try:
              ev_urls = [u for line in open('evidence.txt', errors='ignore') for u in re.findall(r'https?://[^\s]+', line)]
          except Exception:
              pass
          for m in re.finditer(r'(?im)^\s*(INVALID|HOLD|VALID)\b.*?[-:]\s*(.{10,220})', txt):
              verdict, why = m.group(1).upper(), m.group(2).strip()
              if verdict in ('INVALID', 'HOLD') and any(u in why for u in ev_urls):
                  line = f"- {stamp[:10]} REJECTED class @ lead: {why}"
                  if line not in ktext:
                      learnings.append(line)
          with open(kpath, 'a') as k:
              for line in learnings:
                  k.write(line + '\n')
          print(f'appended {len(learnings)} learnings to knowledge/index.md')
          PY

      - name: Commit
        if: steps.collect.outputs.has_leads == 'true' && steps.gate.outputs.has_evidence == 'true'
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add -A || true
          if ! git diff --cached --quiet; then
            git commit -m "triage $(date -u +'%Y-%m-%d-%H-%M')"
          fi
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && break
            echo "triage push attempt $i failed, retrying in 15s..."
            sleep 15
          done